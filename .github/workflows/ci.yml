name: SwitchRoute CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate licensed PromptFeed prompt/image pairs
        run: npm run prompts:import -- data/promptfeed-import.json

      - name: Generate sitemap including PromptFeed prompt detail pages
        run: npm run prompts:sitemap

      - name: Run test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
