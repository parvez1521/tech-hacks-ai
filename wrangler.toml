# Cloudflare Pages configuration for SwitchRoute.
#
# The project already exists as `switchroute-cf-test` (direct-upload test
# deploy at https://switchroute-cf-test.pages.dev). This file documents the
# project binding and build output dir for Git-connected builds and
# `wrangler pages dev`. It sets NO build command: builds run
# `npm run build` (see package.json) as configured in the dashboard;
# direct deploys use:
#   wrangler pages deploy dist --project-name switchroute-cf-test
#
# Vercel config (api/, vercel.json) stays intact — Vercel is the live
# fallback until the DNS cutover is approved by the owner.
name = "switchroute-cf-test"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-26"
