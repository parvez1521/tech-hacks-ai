# Cloudflare Pages configuration for SwitchRoute staging.
#
# This project is a separate Git-integrated staging deployment. The existing
# switchroute-cf-test project remains untouched as a direct-upload fallback.
# Production remains on Vercel until all staging checks pass and the owner
# explicitly approves the DNS cutover.
#
# Build settings are also configured in the Cloudflare dashboard/API:
#   Build command: npm test && npm run build
#   Build output:  dist
#   Root directory: /
#
# For local Pages development:
#   npx wrangler pages dev dist --compatibility-date=2026-11-26
name = "switchroute-staging"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-26"
