<!DOCTYPE html>

    <meta name="description" content="Find free AI plans, open-source alternatives, browser utilities, prompts, and practical guides before adding another subscription." />
    <meta name="theme-color" content="#080D18" />
    <script>
      (function() {
        try {
          // Run before the root mounts so a saved light preference never
          // flashes through the intentional dark first-visit experience.
          var savedTheme = localStorage.getItem('theme');
          var theme = savedTheme === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.add('js');
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', theme === 'dark' ? '#080D18' : '#F8FAFC');
        } catch (e) {}
      })();
    </script>
    <link rel="canonical" href="https://switchroute.in" />

    <!-- Google Analytics 4: basic consent mode. The external tag is loaded only after analytics opt-in. -->
    <script>
      (function () {
        var measurementId = 'G-YMZP8GNP6B';
        var initialized = false;
        var analyticsAllowed = false;
        var lastTrackedUrl = '';

        function getPreferences() {
          try {
            var raw = localStorage.getItem('cookie_consent_preferences');
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        }

        // Queue a denied default before any Google tag is loaded.
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
        window.gtag('consent', 'default', {
          analytics_storage: 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied'
        });

        function sendPageView() {
          window.setTimeout(function () {
            var preferences = getPreferences();
            if (!initialized || !analyticsAllowed || !preferences || preferences.analytics !== true) return;
            if (typeof window.gtag !== 'function') return;

            var currentUrl = location.pathname + location.search + location.hash;
            if (currentUrl === lastTrackedUrl) return;
            lastTrackedUrl = currentUrl;
            window.gtag('event', 'page_view', {
              page_title: document.title,
              page_location: location.href,
              page_path: currentUrl
            });
          }, 0);
        }

        function updateAnalyticsConsent() {
          var preferences = getPreferences();
          var granted = !!preferences && preferences.analytics === true;
          analyticsAllowed = granted;

          window.gtag('consent', 'update', {
            analytics_storage: granted ? 'granted' : 'denied',
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied'
          });

          if (!granted) return;

          if (!initialized) {
            initialized = true;
            window.gtag('js', new Date());
            window.gtag('config', measurementId, { send_page_view: false });

            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId;
            document.head.appendChild(script);
          }

          // Force one page view when consent is newly granted or restored.
          lastTrackedUrl = '';
          sendPageView();
        }

        ['pushState', 'replaceState'].forEach(function (method) {
          var original = history[method];
          history[method] = function () {
            var result = original.apply(this, arguments);
            sendPageView();
            return result;
          };
        });
        window.addEventListener('popstate', sendPageView);
        window.addEventListener('hashchange', sendPageView);
        window.addEventListener('cookie_consent_updated', updateAnalyticsConsent);
        window.addEventListener('storage', updateAnalyticsConsent);
        updateAnalyticsConsent();
      })();
    </script>

    <!-- AdSense site verification uses the meta tag above. Ad serving remains disabled until the site is approved and privacy requirements are met. -->
