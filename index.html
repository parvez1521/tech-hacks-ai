<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwitchRoute — Free AI Tools, Smarter Alternatives &amp; Open Source</title>
    <meta name="description" content="Find free AI plans, open-source alternatives, browser utilities, prompts, and practical guides before adding another subscription." />
    <meta name="theme-color" content="#080D18" />
    <script>
      (function() {
        try {
          // Run before the root mounts so a saved light preference never
          // flashes through the intentional dark first-visit experience.
          var savedTheme = localStorage.getItem('theme');
          var theme = savedTheme === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.add('js');
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', theme === 'dark' ? '#080D18' : '#F8FAFC');
        } catch (e) {}
      })();
    </script>
    <link rel="canonical" href="https://switchroute.in" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SwitchRoute" />
    <meta property="og:title" content="SwitchRoute — Free AI Tools, Smarter Alternatives &amp; Open Source" />
    <meta property="og:description" content="Find free AI plans, open-source alternatives, browser utilities, prompts, and practical guides before adding another subscription." />

    <!-- Google Analytics 4: SwitchRoute -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YMZP8GNP6B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      // Disable automatic initial page_view so SPA navigation is tracked once below.
      gtag('config', 'G-YMZP8GNP6B', { send_page_view: false });

      (function () {
        var lastUrl = location.pathname + location.search + location.hash;
        function trackPageView() {
          var currentUrl = location.pathname + location.search + location.hash;
          if (currentUrl === lastUrl) return;
          lastUrl = currentUrl;
          gtag('event', 'page_view', {
            page_title: document.title,
            page_location: location.href,
            page_path: location.pathname + location.search + location.hash
          });
        }
        // Track the initial document load.
        gtag('event', 'page_view', {
          page_title: document.title,
          page_location: location.href,
          page_path: location.pathname + location.search + location.hash
        });
        ['pushState', 'replaceState'].forEach(function (method) {
          var original = history[method];
          history[method] = function () {
            var result = original.apply(this, arguments);
            trackPageView();
            return result;
          };
        });
        window.addEventListener('popstate', trackPageView);
        window.addEventListener('hashchange', trackPageView);
      })();
    </script>
