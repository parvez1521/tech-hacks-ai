<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Hacks AI — Discover AI Tools, Free Software &amp; Open-Source Alternatives</title>
    <meta name="description" content="A curated discovery platform for top generative AI tools, verified free software, open-source alternatives, step-by-step guides, and developer utilities." />
    <meta name="theme-color" content="#080D18" />
    <script>
      (function() {
        try {
          // Run before the root mounts so a saved light preference never
          // flashes through the intentional dark first-visit experience.
          var savedTheme = localStorage.getItem('theme');
          var theme = savedTheme === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.add('js');
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute('content', theme === 'dark' ? '#080D18' : '#F8FAFC');
        } catch (e) {}
      })();
    </script>
    <link rel="canonical" href="https://techhacksai.com" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tech Hacks AI" />
    <meta property="og:title" content="Tech Hacks AI — Discover AI Tools, Free Software &amp; Open-Source Alternatives" />
    <meta property="og:description" content="A curated discovery platform for top generative AI tools, verified free software, open-source alternatives, step-by-step guides, and developer utilities." />
    <meta property="og:url" content="https://techhacksai.com" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@techhacksai" />
    <meta name="twitter:title" content="Tech Hacks AI — Discover AI Tools, Free Software &amp; Open-Source Alternatives" />
    <meta name="twitter:description" content="A curated discovery platform for top generative AI tools, verified free software, open-source alternatives, step-by-step guides, and developer utilities." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-background text-foreground font-sans antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
